<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нормисы</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <strong>Нормисы</strong>
    </div>
    <p class="count" id="count"></p>
    <button type="button" class="ghost" id="panel-toggle" aria-expanded="false" aria-controls="card">Карточка</button>
  </header>
  <button type="button" class="panel-scrim" id="panel-scrim" hidden aria-label="Закрыть карточку"></button>
  <main>
    <section class="map">
      <div class="map-tools">
        <button type="button" class="ghost map-filters" id="map-filters" aria-expanded="false" aria-controls="pills" aria-label="Фильтры">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M4 5h16l-6.2 7.2V19l-3.6 1.6v-8.4L4 5z"/>
          </svg>
        </button>
        <button type="button" class="ghost catalog-open" id="catalog-open" aria-label="Особенности и события">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 7h12M8 12h12M8 17h12"/>
            <circle cx="4" cy="7" r="1.2" fill="currentColor"/>
            <circle cx="4" cy="12" r="1.2" fill="currentColor"/>
            <circle cx="4" cy="17" r="1.2" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div class="pills" id="pills" role="tablist">
        <button type="button" class="pill on" data-filter="all">Все связи</button>
        <button type="button" class="pill" data-filter="friend">Дружба</button>
        <button type="button" class="pill" data-filter="conflict">Конфликты</button>
        <label class="pill check"><input type="checkbox" id="show-weak"> Показать слабые связи</label>
        <label class="pill check" id="popular-only-label"><input type="checkbox" id="popular-only"> Только популярные</label>
      </div>
      <div id="graph" aria-label="Граф участников"></div>
      <ul class="legend">
        <li><i class="friend"></i> Дружба</li>
        <li><i class="like"></i> Симпатия</li>
        <li><i class="conflict"></i> Конфликт</li>
      </ul>
    </section>
    <aside id="card" aria-live="polite"></aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
